[versions]
app-version-code = "1"
app-version-name = "1.0.0"
sdk-compile = "37"
sdk-min = "24"
sdk-target = "34"

jvm = "17"
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"
ktx = "1.19.1"
coroutines = "1.11.0"
serialization = "1.13.0"

lifecycle = "2.11.0"
dagger = "2.60.1"
hilt = "1.4.0"
ktor = "3.6.1"
chucker = "4.4.0"
hyperion = "0.9.34"
coil = "3.6.3"

accompanist = "0.36.0"
compose-activity = "1.13.0"
compose-bom = "2026.09.00"
compose-navigation = "2.10.2"


[libraries]
androidx-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
android-material = { module = "com.google.android.material:material", version = "1.14.0" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }


compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "compose-activity" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "compose-navigation" }
compose-material = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
compose-ui-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-util = { group = "androidx.compose.ui", name = "ui-util" }
compose-ui-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-coil = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
compose-coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
#compose-test-ui = { group = "androidx.compose.ui", name = "ui-test" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-test-junit = { module = "androidx.compose.ui:ui-test-junit4"}

accompanist-placeholder = { group = "com.google.accompanist", name = "accompanist-placeholder-material", version.ref = "accompanist" }
accompanist-systemuicontroller = { group = "com.google.accompanist", name = "accompanist-systemuicontroller", version.ref = "accompanist" }


hilt-dagger-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "dagger" }
hilt-dagger-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "dagger" }
hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt" }
hilt-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hilt" }


kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version = "0.5.2" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }


ktor-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }

valentinilk-shimmer = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version = "1.5.0" }


chucker-core = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }
chucker-no-op = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }
timber = { group = "com.jakewharton.timber", name = "timber", version = "5.0.1" }

hyperion-core = { group = "com.willowtreeapps.hyperion", name = "hyperion-core", version.ref = "hyperion" }
hyperion-attr = { group = "com.willowtreeapps.hyperion", name = "hyperion-attr", version.ref = "hyperion" }
hyperion-build-config = { group = "com.willowtreeapps.hyperion", name = "hyperion-build-config", version.ref = "hyperion" }
hyperion-crash = { group = "com.willowtreeapps.hyperion", name = "hyperion-crash", version.ref = "hyperion" }
hyperion-disk = { group = "com.willowtreeapps.hyperion", name = "hyperion-disk", version.ref = "hyperion" }
hyperion-geiger-counter = { group = "com.willowtreeapps.hyperion", name = "hyperion-geiger-counter", version.ref = "hyperion" }
hyperion-measurement = { group = "com.willowtreeapps.hyperion", name = "hyperion-measurement", version.ref = "hyperion" }
hyperion-phoenix = { group = "com.willowtreeapps.hyperion", name = "hyperion-phoenix", version.ref = "hyperion" }
hyperion-recorder = { group = "com.willowtreeapps.hyperion", name = "hyperion-recorder", version.ref = "hyperion" }
hyperion-shared-preferences = { group = "com.willowtreeapps.hyperion", name = "hyperion-shared-preferences", version.ref = "hyperion" }
hyperion-timber = { group = "com.willowtreeapps.hyperion", name = "hyperion-timber", version.ref = "hyperion" }

# region ------ 3rd party library (external library) ------
axelbrians-companionkit = { module = "com.github.axelbrians:CompanionKit", version = "0.0.2" }


# region -----test-----
test-androidx-core = { group = "androidx.test", name = "core", version = "1.7.0" }
test-androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.3.0" }
test-androidx-espresso = { group = "androidx.test.espresso", name = "espresso-core", version = "3.7.0" }
test-kotlinx-coroutine = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
test-mockk = { group = "io.mockk", name = "mockk", version = "1.14.12" }
test-junit4 = { group = "junit", name = "junit", version = "4.13.2" }
test-hamcrest = { group = "org.hamcrest", name = "hamcrest", version = "3.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }


[bundles]
ktor = [
    "ktor-android",
    "ktor-content-negotiation",
    "ktor-core",
    "ktor-logging",
    "ktor-okhttp",
    "ktor-serialization"
]
compose-ui = [
    "compose-activity",
    "compose-coil",
    "compose-coil-network",
    "compose-material",
    "compose-material-icons",
    "compose-navigation",
    "compose-ui-foundation",
    "compose-ui-preview",
    "compose-ui-ui",
    "compose-ui-util",
]
hyperion = [
#    "hyperion-attr",
    "hyperion-build-config",
    "hyperion-core",
    "hyperion-crash",
#    "hyperion-disk",
#    "hyperion-geiger-counter",
#    "hyperion-measurement",
#    "hyperion-phoenix",
#    "hyperion-recorder",
#    "hyperion-shared-preferences",
    "hyperion-timber"
]
